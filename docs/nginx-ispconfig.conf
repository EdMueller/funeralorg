# ISPConfig (nginx) – Website → Optionen → "nginx Directives"
#
# Empfohlenes Layout für nginx (Variante 2, Daten außerhalb des Webroots):
#   /var/www/clients/clientX/webY/web/                 ← index.php, .htaccess, assets/
#   /var/www/clients/clientX/webY/private/gedenkseite/ ← app/, bin/, configs/, data/, docs/
# data/ liegt damit außerhalb des Webroots. open_basedir von ISPConfig erlaubt private/.

client_max_body_size 64m;

location /assets/ {
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
}

# Nur index.php soll als PHP ausgeführt werden (im Webroot liegt ohnehin nur diese Datei)
location ~ ^/(?!index\.php$).+\.php$ {
    return 404;
}

# PHP-Einstellungen (Website → Optionen → "Custom php.ini settings"):
#   upload_max_filesize = 40M
#   post_max_size = 64M
#   memory_limit = 768M
#   max_execution_time = 300
#   session.gc_maxlifetime = 14400
