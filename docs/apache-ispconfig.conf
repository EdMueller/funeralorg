# ISPConfig (Apache)
#
# Variante 1 – Unterverzeichnis einer bestehenden Website (z. B. /beerdigung):
#   Keine Direktiven nötig. Voraussetzung ist AllowOverride All (ISPConfig-Standard),
#   damit web/beerdigung/.htaccess greift und app/, bin/, data/, docs/, plugins/ sperrt.
#   Prüfen: curl -sI https://<domain>/beerdigung/data/contacts.json  → 403 oder 404
#
# Variante 2 – eigene Website, web/ = index.php, .htaccess und assets/, Rest in private/gedenkseite/:
#   Ebenfalls keine Direktiven nötig (web/.htaccess wird mitgeliefert).
#
# Variante 3 – Projekt komplett in web/gedenkseite, DocumentRoot auf den Projektordner umbiegen:
DocumentRoot {DOCROOT}/gedenkseite
<Directory {DOCROOT}/gedenkseite>
    AllowOverride All
    Require all granted
</Directory>
